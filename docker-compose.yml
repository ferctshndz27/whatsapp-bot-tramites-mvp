services:
  bot:
    build: .
    container_name: tramites-bot
    restart: unless-stopped
    # Por encima del --timeout-graceful-shutdown del Dockerfile (10 s): Docker tiene que dejar
    # que uvicorn corte sus propias conexiones antes de mandar el SIGKILL, o el apagado limpio
    # no sirve de nada. El default de Docker son 10 s, justo el borde.
    stop_grace_period: 20s
    env_file: .env
    environment:
      # México ya no tiene horario de verano (eliminado en 2022): offset fijo.
      - TZ=America/Mexico_City
      - DB_PATH=/data/tramites.db
      - MEDIA_DIR=/data/media
      # Catálogo editable: vive en el volumen para sobrevivir a los deploys
      # (el JSON del repo es solo la semilla del primer arranque).
      - CATALOG_PATH=/data/catalog.json
      - MSSQL_HOST=mssql
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mssql:
        # Esperar al healthcheck: SQL Server Express tarda decenas de segundos
        # en aceptar logins tras un reinicio del VPS, y arrancar el bot antes
        # provoca tormentas de init() en el primer webhook que llegue.
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tramites-mssql
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City
      - ACCEPT_EULA=Y
      # La contraseña vive solo en .env (gitignored); compose la interpola aquí
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      # Solo loopback del servidor: accesible vía túnel SSH, nunca desde internet
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # sqlcmd vive en /opt/mssql-tools18 en la imagen 2022 (con -C por el
      # certificado autofirmado del contenedor).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mssql_data:
