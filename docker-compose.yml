services:
  bot:
    build: .
    container_name: tramites-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/tramites.db
      - MEDIA_DIR=/data/media
      - MSSQL_HOST=mssql
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mssql

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tramites-mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      # La contraseña vive solo en .env (gitignored); compose la interpola aquí
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      # Solo loopback del servidor: accesible vía túnel SSH, nunca desde internet
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
