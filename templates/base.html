<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trámites — Dashboard{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    :root {
      --sidebar-bg: #191c24;
      --sidebar-text: #a7abb3;
      --sidebar-active: #ffffff;
      --page-bg: #f2f4f8;
      --card-bg: #ffffff;
      --text: #24272d;
      --text-muted: #6c757d;
      --border: #e5e8ee;
      --green: #1bcfb4;   --green-2: #0e9e88;
      --blue: #198ae3;    --blue-2: #0f6ab3;
      --red: #fe7096;     --red-2: #e35480;
      --orange: #ffbf47;  --orange-2: #f5a623;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(24, 28, 36, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page-bg); color: var(--text); font-size: 15px;
    }
    a { color: var(--blue); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--blue); outline-offset: 2px;
    }

    .layout { display: flex; min-height: 100vh; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 230px; flex-shrink: 0; background: var(--sidebar-bg);
      color: var(--sidebar-text); padding: 1.25rem 0; display: flex; flex-direction: column;
    }
    .sidebar .brand {
      color: #fff; font-weight: 700; font-size: 1.1rem; letter-spacing: .5px;
      padding: 0 1.25rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .sidebar nav { flex: 1; margin-top: .75rem; }
    .sidebar nav a {
      display: block; color: var(--sidebar-text); text-decoration: none;
      padding: .7rem 1.25rem; min-height: 44px; line-height: 1.6;
    }
    .sidebar nav a:hover { color: #fff; background: rgba(255,255,255,.05); }
    .sidebar nav a[aria-current="page"] {
      color: var(--sidebar-active); background: rgba(255,255,255,.08);
      border-left: 3px solid var(--green); padding-left: calc(1.25rem - 3px);
    }
    .sidebar .userbox {
      padding: 1rem 1.25rem; border-top: 1px solid rgba(255,255,255,.08); font-size: .85rem;
    }
    .sidebar .userbox a { color: var(--red); text-decoration: none; }
    .sidebar .userbox a:hover { text-decoration: underline; }

    /* ---- Main ---- */
    .main { flex: 1; padding: 1.5rem 2rem; min-width: 0; }
    h1 { font-size: 1.35rem; margin: 0 0 1.25rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .75rem; }

    /* ---- Stat cards ---- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      border-radius: var(--radius); padding: 1.1rem 1.25rem; color: #fff; box-shadow: var(--shadow);
    }
    .stat-card .label { font-size: .85rem; opacity: .9; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; margin-top: .2rem; }
    .stat-card.green  { background: linear-gradient(120deg, var(--green), var(--green-2)); }
    .stat-card.blue   { background: linear-gradient(120deg, var(--blue), var(--blue-2)); }
    .stat-card.red    { background: linear-gradient(120deg, var(--red), var(--red-2)); }
    .stat-card.orange { background: linear-gradient(120deg, var(--orange), var(--orange-2)); color: #4a3200; }

    /* ---- Cards / panels ---- */
    .card {
      background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
    }

    /* ---- Filter pills ---- */
    .pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .pills a {
      text-decoration: none; color: var(--text-muted); background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 999px; padding: .45rem 1rem; min-height: 40px;
      display: inline-flex; align-items: center; font-size: .85rem;
    }
    .pills a:hover { border-color: var(--blue); color: var(--blue); }
    .pills a[aria-current="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .75rem .6rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--text-muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
    tbody tr:hover { background: #f8fafc; }

    .avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%; color: #fff; font-weight: 700; font-size: .8rem;
      margin-right: .6rem; flex-shrink: 0;
    }
    .cell-person { display: flex; align-items: center; }
    .cell-person .sub { color: var(--text-muted); font-size: .8rem; }

    /* ---- Badges ---- */
    .badge {
      display: inline-block; padding: .25rem .7rem; border-radius: 999px;
      font-size: .75rem; font-weight: 700; letter-spacing: .3px;
    }
    .badge.nuevo      { background: #ffe3ea; color: #b0295a; }
    .badge.tomado     { background: #fff1d6; color: #8a5b00; }
    .badge.en_proceso { background: #d9ecfb; color: #0f5c9e; }
    .badge.cerrado    { background: #d5f6f0; color: #0b6e5d; }
    .badge.escalado   { background: #191c24; color: #ffd35c; }

    /* ---- Forms & buttons ---- */
    label { display: block; margin-bottom: .35rem; font-size: .85rem; color: var(--text-muted); }
    input[type=text], input[type=password], select {
      width: 100%; max-width: 320px; padding: .6rem .75rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: .95rem; background: #fff; min-height: 44px;
    }
    button {
      background: var(--blue); color: #fff; border: 0; border-radius: 6px;
      padding: .6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    button:hover { background: var(--blue-2); }
    .btn-sm { padding: .35rem .9rem; font-size: .82rem; min-height: 36px; background: var(--green-2); }
    .btn-sm:hover { background: #0a7a69; }
    .btn-danger { background: var(--red-2); }
    .btn-danger:hover { background: #c43e68; }
    .error {
      background: #ffe3ea; color: #b0295a; border-radius: 6px; padding: .75rem 1rem; margin-bottom: 1rem;
    }

    /* ---- Inbox ---- */
    .convo-list { display: flex; flex-direction: column; gap: .6rem; }
    .convo-card {
      display: flex; align-items: center; gap: .75rem; text-decoration: none; color: inherit;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: .8rem 1rem; box-shadow: var(--shadow);
    }
    .convo-card:hover { border-color: var(--blue); }
    .convo-card .body { flex: 1; min-width: 0; }
    .convo-card .preview {
      color: var(--text-muted); font-size: .85rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .convo-card .when { color: var(--text-muted); font-size: .78rem; flex-shrink: 0; align-self: flex-start; }
    .convo-card .badges { display: flex; gap: .35rem; margin-top: .3rem; flex-wrap: wrap; }
    .badge.esperando { background: #fff1d6; color: #8a5b00; }
    .badge.caducada  { background: #ffe3ea; color: #b0295a; }
    .badge.pausado   { background: #191c24; color: #9fd8ff; }
    .badge.asignada  { background: #eef1f6; color: #444; }

    /* ---- Composer ---- */
    .composer { border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; }
    .composer textarea {
      width: 100%; min-height: 70px; padding: .6rem .75rem; border: 1px solid var(--border);
      border-radius: 6px; font: inherit; resize: vertical;
    }
    .composer .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .5rem; }
    .qr-bar { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .qr-bar button {
      background: var(--card-bg); color: var(--blue); border: 1px solid var(--blue);
      padding: .3rem .8rem; font-size: .8rem; min-height: 36px;
    }
    .qr-bar button:hover { background: #d9ecfb; }
    .banner-warn {
      background: #fff1d6; color: #8a5b00; border-radius: 6px; padding: .75rem 1rem; margin: .75rem 0;
    }
    .bubble img { max-width: 220px; border-radius: 8px; display: block; margin-top: .3rem; }

    /* ---- Chat ---- */
    .chat { display: flex; flex-direction: column; gap: .5rem; }
    .bubble {
      max-width: 70%; padding: .6rem .9rem; border-radius: 12px; line-height: 1.45;
      overflow-wrap: break-word;
    }
    .bubble .meta { display: block; font-size: .72rem; color: var(--text-muted); margin-top: .25rem; }
    .bubble.in  { background: #eef1f6; align-self: flex-start; border-bottom-left-radius: 3px; }
    .bubble.out { background: #d9ecfb; align-self: flex-end; border-bottom-right-radius: 3px; }

    /* ---- Login (sin sidebar) ---- */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card input { max-width: none; }
    .login-card button { width: 100%; margin-top: .5rem; }

    .empty { color: var(--text-muted); padding: 2rem 0; text-align: center; }

    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; padding: .5rem 1rem; gap: .5rem; }
      .sidebar .brand { border: 0; padding: 0 1rem 0 0; }
      .sidebar nav { display: flex; margin: 0; }
      .sidebar nav a[aria-current="page"] { border-left: 0; border-bottom: 3px solid var(--green); padding-left: 1.25rem; }
      .sidebar .userbox { border: 0; margin-left: auto; padding: 0; }
      .main { padding: 1rem; }
      .bubble { max-width: 90%; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pills a, button, .sidebar nav a { transition: background-color .15s, color .15s, border-color .15s; }
    }
  </style>
</head>
<body>
  {% if user %}
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Trámites</div>
      <nav aria-label="Principal">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Solicitudes</a>
        <a href="/inbox" {% if request.url.path.startswith('/inbox') %}aria-current="page"{% endif %}>Bandeja</a>
        <a href="/team" {% if request.url.path.startswith('/team') %}aria-current="page"{% endif %}>Equipo</a>
        <a href="/activity" {% if request.url.path.startswith('/activity') %}aria-current="page"{% endif %}>Actividad</a>
        {% if is_admin(user) %}
        <a href="/invitations" {% if request.url.path.startswith('/invitations') %}aria-current="page"{% endif %}>Invitaciones</a>
        <a href="/users" {% if request.url.path.startswith('/users') %}aria-current="page"{% endif %}>Usuarios</a>
        {% endif %}
      </nav>
      <div class="userbox">
        {{ user }} · <a href="/logout">Salir</a>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
  {% block content_public %}{% endblock %}
  {% endif %}
</body>
</html>
