{% extends "base.html" %}
{% block title %}Chat de equipo{% endblock %}
{% block head %}
<meta name="auto-recarga" content="20">
<link rel="stylesheet" href="/static/css/team.css">
<script src="/static/js/team.js" defer></script>
{% endblock %}
{% block content %}
<div class="chat-container" id="chat">
    <div class="rooms-sidebar">
        <div class="rooms-sidebar-header">
            <h2>Salas</h2>
            <button class="btn-sm" onclick="document.getElementById('new-room-modal').style.display='block'">+ Nuevo</button>
        </div>
        <ul class="room-list">
            {% for r in rooms %}
            <li class="room-item" data-room-id="{{ r.id }}" onclick="loadRoom({{ r.id }})">
                <div class="room-name">{{ r.name or 'Chat Privado' }}</div>
            </li>
            {% endfor %}
        </ul>
    </div>
    
    <div class="main-chat" id="main-chat">
        <div class="no-room-selected">
            Selecciona una sala para comenzar a chatear.
        </div>
    </div>
</div>

<div id="new-room-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h3>Crear Sala</h3>
        <form method="post" action="/team/rooms">
            <label>Nombre del Grupo (vacío para DM):</label>
            <input type="text" name="name">
            <input type="hidden" name="room_type" value="group">
            
            <label>Integrantes:</label>
            <select name="members" multiple required>
                {% for ou in office_users %}
                <option value="{{ ou.username }}">{{ ou.username }}</option>
                {% endfor %}
            </select>
            
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <button type="submit" class="btn-approve">Crear</button>
                <button type="button" class="btn-ignore" onclick="document.getElementById('new-room-modal').style.display='none'">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Config values for JS
    window.TEAM_GENERAL_ROOM_ID = {{ general_room_id }};
</script>
{% endblock %}
