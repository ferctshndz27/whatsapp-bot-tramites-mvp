name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sincronizar código al VPS
        # .env, data/ y media/ viven solo en el servidor — nunca se tocan
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'data/' --exclude 'media/' --exclude '.venv' \
            --exclude '__pycache__' --exclude '*.db' \
            ./ "root@${{ secrets.VPS_HOST }}:/opt/whatsapp-bot-tramites/"

      - name: Reconstruir y reiniciar contenedor
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" \
            "cd /opt/whatsapp-bot-tramites && docker compose up -d --build"

      - name: Verificar despliegue (health check)
        run: |
          for i in $(seq 1 12); do
            if ssh "root@${{ secrets.VPS_HOST }}" "curl -sf http://127.0.0.1:8000/health" > /dev/null; then
              echo "Despliegue OK"; exit 0
            fi
            sleep 5
          done
          echo "El servicio no respondió tras el despliegue"
          ssh "root@${{ secrets.VPS_HOST }}" "cd /opt/whatsapp-bot-tramites && docker compose logs --tail 50 bot"
          exit 1
