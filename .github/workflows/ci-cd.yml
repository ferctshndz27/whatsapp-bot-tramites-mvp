name: CI/CD

# Modelo pull: GitHub no guarda ninguna credencial del VPS.
# 1. Cada push/PR corre los tests.
# 2. Si pasan en main, la rama `production` avanza a ese commit
#    (con el GITHUB_TOKEN efímero de Actions, no un secreto almacenado).
# 3. El VPS hace polling de `production` con una deploy key de solo
#    lectura y se redespliega solo (ver deploy/pull-deploy.sh).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest -q

  # CI instalaba requirements.txt y corría pytest, pero NUNCA construía la
  # imagen: eso solo pasaba en el VPS, ya con `production` movido. Un commit que
  # rompa el build —un COPY que falta, una dependencia que necesita compilador,
  # una edición del Dockerfile— pasaba verde, `promote` avanzaba, y el cron
  # entraba en un bucle que NO se cura solo: `up --build` falla, rollback
  # devuelve HEAD al commit viejo, el siguiente tick ve LOCAL != REMOTE y
  # reintenta... cada 2 minutos, indefinidamente, en una caja de 2 vCPU. Ese
  # reintento es deliberado para un fallo transitorio (un MSSQL enfermo); para
  # un build roto es una máquina quemándose.
  # Se construye y se tira: sin buildx, sin registry, sin push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t tramites-bot:ci .

  promote:
    # Los dos, y en paralelo: un build roto no debe llegar a `production` igual
    # que no debe llegar un test rojo.
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: promote-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promover a production
        run: git push origin HEAD:production
