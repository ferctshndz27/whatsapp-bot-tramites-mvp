[pytest]
# Avisos de TERCEROS que no se arreglan desde este repo. Cada filtro es exacto:
# un mensaje Y el módulo que lo emite, así que un aviso nuevo de app/ o de las
# pruebas sigue saliendo. No agregar filtros por categoría entera
# (DeprecationWarning a secas): esconderían justo los que sí son nuestros.
filterwarnings =
    # Python 3.14 volvió obsoleto asyncio.iscoroutinefunction y Starlette/FastAPI
    # lo llaman en cada petición: ~2000 avisos por corrida en el venv local (3.14).
    # En CI y en la imagen (3.12) no existen. Se van al subir FastAPI/Starlette.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette
