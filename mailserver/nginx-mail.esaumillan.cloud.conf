# Referencia — aplicar a mano en el VPS (la config de nginx no vive en git
# en este proyecto). Mismo patrón que /etc/nginx/sites-available/bot.esaumillan.cloud,
# apuntando al puerto local donde Poste.io publica su panel web/webmail.
#
# Paso 1 (este archivo, sin TLS todavía — certbot lo completa después):
server {
    listen 80;
    server_name mail.esaumillan.cloud;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Paso 2: correr `certbot --nginx -d mail.esaumillan.cloud` — certbot detecta
# este server block, agrega el listen 443 ssl + certificados, y el
# redirect 80->443 automáticamente (mismo mecanismo ya usado para bot.esaumillan.cloud).
